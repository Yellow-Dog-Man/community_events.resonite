services:
  traefik: !reset []
  mkdocs: !reset []
  database:
    image: postgres:16
    profiles:
      - database
    restart: unless-stopped
    ports: !reset []
    expose:
      - 5432
    secrets:
      - postgres_password
      - postgres_user
      - postgres_db
    environment: !override
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/postgres_user)"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  migrations:
    build: .
    command: >
      /bin/bash -c "
      poetry run alembic upgrade head;
      EXIT_CODE=$?;
      if [ $EXIT_CODE -ne 0 ]; then
        echo 'Alembic migration failed with exit code' $EXIT_CODE;
        exit $EXIT_CODE;
      fi
      "
    volumes:
      - "./config.YDMS.toml:/app/config.toml"
    depends_on:
      database:
        condition: service_healthy
    profiles:
      - manager
      - client

  signals_manager:
    build: .
    restart: always
    command: poetry run signals_manager
    profiles:
      - manager
    depends_on:
      migrations:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    volumes:
      - "./config.YDMS.toml:/app/config.toml"

  api_client:
    build: .
    restart: always
    profiles:
      - client
    command: poetry run api_client
    depends_on:
      migrations:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    volumes:
      - "./config.YDMS.toml:/app/config.toml"
    ports:
      - '9000:8000'
  web_client:
    build: .
    restart: always
    profiles:
      - client
    command: poetry run web_client
    depends_on:
      migrations:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    volumes:
      - "./config.YDMS.toml:/app/config.toml"
    ports:
      - '9001:8001'

  cache:
    image: redis:7.0-alpine
    restart: always
    command: redis-server --save ""
    ports: !reset []
    expose:
      - 6379

secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  postgres_user:
    environment: POSTGRES_USER
  postgres_db:
    environment: POSTGRES_DB

volumes:
  postgres_data:
    driver: local